# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The canonical check uses a scratch TF_DATA_DIR and backend-free init, so it
# needs network access for provider schemas but no cloud credentials or state.
name: Infrastructure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  workflow_dispatch:
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # validation only reads the tree
      - name: Set up mise tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3 # pinned mise; bump deliberately with mise.lock tooling
          install: false
          cache: true
      - name: Install OpenTofu tools
        run: mise install --locked -y opentofu tflint
      - name: Validate and lint the OpenTofu configuration
        run: mise run check:tofu
