# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The canonical check uses a scratch TF_DATA_DIR and backend-free init, so it
# needs network access for provider schemas but no cloud credentials or state.
name: Infrastructure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  workflow_dispatch:
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # validation only reads the tree
      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          cache: true
      - name: Install OpenTofu tools
        run: mise install --locked -y opentofu tflint
      - name: Validate and lint the OpenTofu configuration
        run: mise run check:tofu
