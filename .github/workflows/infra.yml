# `tofu init` downloads provider schemas, and in a working copy where someone has
# already run a real init it also opens the state backend — so this is neither
# offline nor credential-free, and it does not belong in the pre-commit hook that
# every commit pays for. A fresh checkout has no backend to open, which is why
# the plain upstream commands are enough here.
name: Infrastructure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
      - "mise.lock"
      - "mise.toml"
  workflow_dispatch:
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # validation only reads the tree
      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          cache: true
      - name: Install OpenTofu tools
        run: mise install --locked -y opentofu tflint
      - name: Validate and lint the OpenTofu configuration
        run: mise run check:tofu
