# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# External link rot and bot blocking are scheduled checks, not merge gates.
name: External content links
on:
  schedule:
    # Monday morning, early enough to be triaged before the week fills up. Off
    # the hour, since GitHub delays schedules that pile up on a round minute.
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: links
  cancel-in-progress: true
jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the checker only reads the tree
      - name: Set up mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: true
      - name: Install link checker
        run: mise install --locked -y lychee
      - name: Check external content links
        run: mise run check:links
