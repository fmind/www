# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Only what `${{ env.* }}` expressions below read; tasks take the rest from mise.toml [env].
  PROJECT_ID: www-fmind-dev
  REPOSITORY: app
  SERVICE_NAME: www-fmind-dev
  AR_HOSTNAME: europe-west1-docker.pkg.dev
  WORKLOAD_IDENTITY_PROVIDER: "projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions@www-fmind-dev.iam.gserviceaccount.com"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      head: ${{ steps.head.outputs.head }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:leaks scans the last 100 commits; the default depth-1 checkout
          # would silently narrow that to one. The weekly security workflow still
          # owns the full-history scan — this only keeps the gate honest.
          fetch-depth: 100
          persist-credentials: false # the gate only reads the tree, never pushes back
      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
      - name: Install dependencies
        # `all` installs Chromium itself; installing it here would repeat that.
        run: mise run install:python
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pin the builder: the action otherwise pulls the mutable buildx-stable-1
          # tag. Dependabot does not bump driver-opts; keep both jobs in step.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Select the daily Trivy database cache
        id: trivy-cache
        run: echo "key=trivy-db-${RUNNER_OS}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability database
        # Trivy still refreshes a cached database once its NextUpdate passes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Full canonical gate
        run: mise run all
      - name: Verify the quality gate left the checkout unchanged
        run: test -z "$(git status --porcelain)"
      - name: Confirm the commit is still the head of main
        id: head
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m scripts.deploy --check-head
      - name: Retain browser results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: tmp/browser-results
          retention-days: 14
          if-no-files-found: ignore
  deploy:
    needs: verify
    if: needs.verify.outputs.head == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # deploy authenticates to GCP via WIF, not git
      - name: Set up pinned deployment tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv python trivy
          cache: false # this job holds id-token; never read shared caches
      - name: Install locked smoke environment
        run: uv sync --locked --no-dev --group ops
      - name: Stop unless the commit is still the head of main
        # The verify output can be stale: a re-run of this job reuses it while main moved on.
        # Fail closed here so an older commit never replaces a newer release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev --group ops python -m scripts.deploy --check-head && grep -qx head=true "$GITHUB_OUTPUT"
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 593.0.0 # pinned Cloud SDK; the action defaults to latest
      - name: Docker Auth
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # this job holds id-token; never read shared caches
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: runner
          push: true
          provenance: mode=max
          # Pin the SBOM generator: `sbom: true` runs the mutable
          # buildkit-syft-scanner:stable-1 tag inside this build. Dependabot does not
          # bump it; upgrade it together with the BuildKit pin above.
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          # Cloud Run consumes the scanned digest below. Avoid mutating an
          # unscanned `latest` pointer before that scan has passed.
          tags: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # This job holds id-token; never read shared caches. No BuildKit or Trivy cache:
          # the verify job runs third-party code and could poison either. The build
          # starts clean (fresh Debian security fixes too) and Trivy downloads its database.
      - name: Stop unless the commit is still the head of main before the rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev --group ops python -m scripts.deploy --check-head && grep -qx head=true "$GITHUB_OUTPUT"
      - name: Roll out and verify the image digest
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run deploy "$IMAGE_REF" "$GITHUB_SHA"
