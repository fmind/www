# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PROJECT_ID: www-fmind-dev
  REGION: europe-west1
  REPOSITORY: app
  SERVICE_NAME: www-fmind-dev
  AR_HOSTNAME: europe-west1-docker.pkg.dev
  WORKLOAD_IDENTITY_PROVIDER: "projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions@www-fmind-dev.iam.gserviceaccount.com"
  # Stable traffic tag: each deploy moves it to the new no-traffic revision.
  CANDIDATE_TAG: candidate
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:leaks scans the last 100 commits; the default depth-1 checkout
          # would silently narrow that to one. The weekly security workflow still
          # owns the full-history scan — this only keeps the gate honest.
          fetch-depth: 100
          persist-credentials: false # the gate only reads the tree, never pushes back
      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Install dependencies
        # `all` installs Chromium itself; installing it here would repeat that.
        run: mise run install:python
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select the daily Trivy database cache
        id: trivy-cache
        run: echo "key=trivy-db-${RUNNER_OS}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability database
        # Trivy still refreshes a cached database once its NextUpdate passes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Full canonical gate (including production image scan)
        run: mise run all
      - name: Verify the quality gate left the checkout unchanged
        run: test -z "$(git status --porcelain)"
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # deploy authenticates to GCP via WIF, not git
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      - name: Install pinned deployment tools
        run: mise install --locked -y aqua:astral-sh/uv python trivy
      - name: Install locked smoke environment
        run: mise exec aqua:astral-sh/uv -- uv sync --locked --no-dev --group ops
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Docker Auth
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: runner
          push: true
          provenance: mode=max
          sbom: true
          # Cloud Run consumes the scanned digest below. Avoid mutating an
          # unscanned `latest` pointer before that scan has passed.
          tags: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select the daily Trivy database cache
        id: trivy-cache
        run: echo "key=trivy-db-${RUNNER_OS}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the Trivy vulnerability database
        # Restore-only: the privileged job never writes shared caches. Entries
        # for main are written only by main-branch runs of the verify job.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Scan pushed image digest
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run check:image:digest "$IMAGE_REF"
      - name: Smoke pushed image digest
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:image "$IMAGE_REF"
      - name: Deploy candidate revision without traffic
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
          # `gcloud run deploy --no-traffic --tag`: pins current traffic to the
          # serving revision and exposes the new one only on its tagged URL.
          no_traffic: true
          tag: ${{ env.CANDIDATE_TAG }}
      - name: Verify candidate revision on its tagged URL
        id: candidate
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:candidate
      - name: Promote the verified revision
        # Route traffic to the exact verified revision, not to "latest", so a
        # revision created after verification can never receive it.
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE_NAME"
          --project "$PROJECT_ID" --billing-project "$PROJECT_ID" --region "$REGION"
          --to-revisions "$REVISION=100" --quiet
      - name: Verify ready release and public health
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:deployed
