# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PROJECT_ID: www-fmind-dev
  REGION: europe-west1
  REPOSITORY: app
  SERVICE_NAME: www-fmind-dev
  AR_HOSTNAME: europe-west1-docker.pkg.dev
  WORKLOAD_IDENTITY_PROVIDER: "projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions@www-fmind-dev.iam.gserviceaccount.com"
  # Stable traffic tag: each deploy moves it to the new no-traffic revision.
  CANDIDATE_TAG: candidate
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:leaks scans the last 100 commits; the default depth-1 checkout
          # would silently narrow that to one. The weekly security workflow still
          # owns the full-history scan — this only keeps the gate honest.
          fetch-depth: 100
          persist-credentials: false # the gate only reads the tree, never pushes back
      - name: Set up mise tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21 # pinned mise; bump deliberately with mise.lock tooling
          install: true
          cache: true
      - name: Install dependencies
        # `all` installs Chromium itself; installing it here would repeat that.
        run: mise run install:python
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pin the builder: the action otherwise pulls the mutable buildx-stable-1
          # tag. Dependabot does not bump driver-opts; keep both jobs in step.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Select the daily Trivy database cache
        id: trivy-cache
        run: echo "key=trivy-db-${RUNNER_OS}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability database
        # Trivy still refreshes a cached database once its NextUpdate passes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Full canonical gate (including production image scan)
        run: mise run all
      - name: Verify the quality gate left the checkout unchanged
        run: test -z "$(git status --porcelain)"
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # deploy authenticates to GCP via WIF, not git
      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21 # pinned mise; bump deliberately with mise.lock tooling
          install: false
          cache: false
      - name: Install pinned deployment tools
        run: mise install --locked -y aqua:astral-sh/uv python trivy
      - name: Install locked smoke environment
        run: mise exec aqua:astral-sh/uv -- uv sync --locked --no-dev --group ops
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Docker Auth
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: runner
          push: true
          provenance: mode=max
          # Pin the SBOM generator: `sbom: true` runs the mutable
          # buildkit-syft-scanner:stable-1 tag inside this build. Dependabot does not
          # bump it; upgrade it together with the BuildKit pin above.
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          # Cloud Run consumes the scanned digest below. Avoid mutating an
          # unscanned `latest` pointer before that scan has passed.
          tags: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # This job holds id-token; never read shared caches. No BuildKit or Trivy cache:
          # the verify job runs third-party code and could poison either. The build
          # starts clean (fresh Debian security fixes too) and Trivy downloads its database.
      - name: Scan pushed image digest
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run check:image:digest "$IMAGE_REF"
      - name: Smoke pushed image digest
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:image "$IMAGE_REF"
      - name: Deploy candidate revision without traffic
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          gcloud_version: 591.0.0 # pinned Cloud SDK; the action defaults to latest
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
          # `gcloud run deploy --no-traffic --tag`: pins current traffic to the
          # serving revision and exposes the new one only on its tagged URL.
          no_traffic: true
          tag: ${{ env.CANDIDATE_TAG }}
      - name: Verify candidate revision on its tagged URL
        id: candidate
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:candidate
      - name: Promote the verified revision
        # Route traffic to the exact verified revision, not to "latest", so a
        # revision created after verification can never receive it. Drop the
        # candidate tag too: a tagged revision stays publicly reachable, so a
        # later rollback would otherwise leave this one served on its tag URL.
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE_NAME"
          --project "$PROJECT_ID" --billing-project "$PROJECT_ID" --region "$REGION"
          --to-revisions "$REVISION=100" --remove-tags "$CANDIDATE_TAG" --quiet
      - name: Verify ready release and public health
        env:
          IMAGE_REF: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}
        run: mise run test:deployed
      - name: Remove the candidate tag after a failed verification
        # A tagged revision stays publicly reachable on its run.app tag URL; do not
        # leave one that failed verification served there until the next deployment.
        if: failure() && steps.candidate.outcome == 'failure'
        run: >-
          gcloud run services update-traffic "$SERVICE_NAME"
          --project "$PROJECT_ID" --billing-project "$PROJECT_ID" --region "$REGION"
          --remove-tags "$CANDIDATE_TAG" --quiet
