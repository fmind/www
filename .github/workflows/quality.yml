# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Browser and Lighthouse qualification
run-name: Browser and Lighthouse (${{ inputs.target || 'local' }})
on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      target:
        description: Qualify the checkout locally or the currently deployed public site
        type: choice
        options: [local, production]
        default: local
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ inputs.target || 'local' }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_BASE_URL: ${{ inputs.target == 'production' && 'https://www.fmind.dev' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install pinned tools
        run: mise install --locked -y aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Install browser binaries and ephemeral runner libraries
        run: mise run install:browser:cross -- --with-deps
      - name: Exercise Firefox and WebKit
        run: mise run test:browser:cross
      - name: Install Chromium for production journeys
        if: inputs.target == 'production'
        run: mise run install:browser
      - name: Exercise production Chromium journeys
        if: inputs.target == 'production'
        run: mise run --skip-deps test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-browser-results
          path: |
            tmp/cross-browser-results
            tmp/browser-results
          retention-days: 14
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install pinned tools
        run: mise install --locked -y aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright npm:lighthouse
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Install Chromium
        run: mise run install:browser
      - name: Allow the pinned Chromium sandbox
        # Ubuntu restricts user namespaces for downloaded browsers. Grant only
        # this executable access; retain Chromium's sandbox and host policy.
        run: |
          chromium_path="$(NODE_PATH="$(mise where npm:playwright)/node_modules" node -p 'require("playwright").chromium.executablePath()')"
          test -x "$chromium_path"
          sudo tee /etc/apparmor.d/www-lighthouse-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile www-lighthouse-chromium "$chromium_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/www-lighthouse-chromium
      - name: Qualify local portfolio pages
        if: inputs.target != 'production'
        run: mise run test:lighthouse:local
      - name: Qualify production portfolio pages
        if: inputs.target == 'production'
        run: mise run test:lighthouse -- --base-url https://www.fmind.dev --mode portfolio
      - name: Retain exact Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-portfolio
          path: tmp/lighthouse
          retention-days: 14
          if-no-files-found: error
