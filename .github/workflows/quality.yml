# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Browser and Lighthouse qualification
run-name: Browser and Lighthouse (${{ inputs.target || 'local' }})
on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      target:
        description: Qualify the checkout locally or the currently deployed public site
        type: choice
        options: [local, production]
        default: local
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ inputs.target || 'local' }}
  cancel-in-progress: true
env:
  BROWSER_BASE_URL: ${{ inputs.target == 'production' && 'https://www.fmind.dev' || '' }}
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright
      - name: Install Python dependencies
        run: uv sync --locked --no-dev
      - name: Install browser binaries and ephemeral runner libraries
        run: mise run install:browser:cross -- --with-deps
      - name: Exercise Firefox and WebKit
        run: mise run test:browser:cross
      - name: Install Chromium for production journeys
        if: inputs.target == 'production'
        run: mise run install:browser
      - name: Exercise production Chromium journeys
        if: inputs.target == 'production'
        run: mise run --skip-deps test:browser
      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-results
          path: |
            tmp/cross-browser-results
            tmp/browser-results
          retention-days: 14
          # Green local runs leave no evidence; the default `warn` would annotate every one.
          if-no-files-found: ignore
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright npm:lighthouse
      - name: Install Python dependencies
        run: uv sync --locked --no-dev
      - name: Install Chromium
        run: mise run install:browser
      - name: Allow the pinned Chromium sandbox
        run: node scripts/lighthouse.mjs --allow-sandbox
      - name: Qualify portfolio pages
        run: mise run test:lighthouse:local
      - name: Retain exact Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-portfolio
          path: tmp/lighthouse
          retention-days: 14
          if-no-files-found: error
