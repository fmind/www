# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Browser and Lighthouse qualification
run-name: Browser and Lighthouse (${{ inputs.target || 'local' }})
on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      target:
        description: Qualify the checkout locally or the currently deployed public site
        type: choice
        options: [local, production]
        default: local
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.ref }}-${{ inputs.target || 'local' }}
  cancel-in-progress: true
env:
  BROWSER_BASE_URL: ${{ inputs.target == 'production' && 'https://www.fmind.dev' || '' }}
  QUALITY_TARGET: ${{ inputs.target || 'local' }}
jobs:
  browsers:
    name: Cross-browser journeys
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: $/.github/actions/setup-mise
        with:
          tools: ${{ inputs.target == 'production' && 'node npm:playwright' || 'aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright' }}
      - name: Cache uv downloads
        if: ${{ inputs.target != 'production' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install Python dependencies
        if: ${{ inputs.target != 'production' }}
        run: UV_MALWARE_CHECK=1 uv sync --locked --no-dev --preview-features malware-check
      - name: Install browser binaries and ephemeral runner libraries
        run: |
          # GitHub Ubuntu runners may list cleartext http://azure.archive.ubuntu.com first;
          # drop http:// entries when https:// mirrors exist so port-80 stalls cannot hang apt.
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q '^https://' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/^http:\/\//d' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "10";\nAcquire::https::Timeout "10";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99quality-timeouts >/dev/null
          mise run install:browser:cross -- --with-deps
      - name: Exercise Firefox and WebKit
        run: |
          if [ "$QUALITY_TARGET" = "production" ]; then
            mise run --skip-deps test:browser:cross
          else
            mise run test:browser:cross
          fi
      - name: Install Chromium for production journeys
        if: ${{ inputs.target == 'production' }}
        run: mise run install:browser
      - name: Exercise production Chromium journeys
        if: ${{ inputs.target == 'production' }}
        run: mise run --skip-deps test:browser
      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-results
          path: |
            tmp/cross-browser-results
            tmp/browser-results
          retention-days: 14
          # Green local runs leave no evidence; the default `warn` would annotate every one.
          if-no-files-found: ignore
  lighthouse:
    name: Lighthouse portfolio matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: $/.github/actions/setup-mise
        with:
          tools: ${{ inputs.target == 'production' && 'node npm:playwright npm:lighthouse' || 'aqua:astral-sh/uv python node github:dobicinaitis/tailwind-cli-extra npm:playwright npm:lighthouse' }}
      - name: Cache uv downloads
        if: ${{ inputs.target != 'production' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install Python dependencies
        if: ${{ inputs.target != 'production' }}
        run: UV_MALWARE_CHECK=1 uv sync --locked --no-dev --preview-features malware-check
      - name: Install Chromium
        run: mise run install:browser
      - name: Allow the pinned Chromium sandbox
        run: |
          chromium_path="$(NODE_PATH="$(mise where npm:playwright)/node_modules" node -e 'console.log(require("playwright").chromium.executablePath())')"
          profile="$(mktemp)"
          trap 'rm -f "$profile"' EXIT
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile www-lighthouse-chromium "$chromium_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -m 0644 "$profile" /etc/apparmor.d/www-lighthouse-chromium
          sudo apparmor_parser -r /etc/apparmor.d/www-lighthouse-chromium
      - name: Qualify portfolio pages
        run: |
          if [ "$QUALITY_TARGET" = "production" ]; then
            mise run --skip-deps test:lighthouse:local
          else
            mise run test:lighthouse:local
          fi
      - name: Retain exact Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-portfolio
          path: tmp/lighthouse
          retention-days: 14
          if-no-files-found: error
