# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history and source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # scanners only read the checkout
      - name: Set up security scanners
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv betterleaks trivy
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Scan Dockerfile and infrastructure configuration
        # Each scan is independent: a failed one (such as a Trivy database mirror
        # outage) must not skip the others. Both repeat gate tasks, so new advisories
        # and checks surface on quiet weeks without pushes.
        if: ${{ !cancelled() }}
        run: mise run check:scan
      - name: Audit locked dependencies
        if: ${{ !cancelled() }}
        run: mise run check:vuln
  deployed-image:
    name: Scan images receiving production traffic
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout scanner policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up scanner and runtime
        uses: ./.github/actions/setup-mise
        with:
          tools: python trivy
          cache: false # this job holds id-token; never read shared caches
      - name: Authenticate read-only scanner
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: github-security@www-fmind-dev.iam.gserviceaccount.com
          workload_identity_provider: projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 592.0.0 # pinned Cloud SDK; the action defaults to latest
      - name: Authenticate image pulls
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Resolve and scan every serving digest
        run: mise run check:image:deployed
      - name: Retain digest and advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-image-advisories
          path: tmp/security/
          if-no-files-found: error
          retention-days: 30
