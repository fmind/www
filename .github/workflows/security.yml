# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history and source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # scanners only read the checkout
      - name: Set up mise tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4 # pinned mise; bump deliberately with mise.lock tooling
          install: false
          cache: true
          # Key tools on the lockfiles only: task edits in mise.toml must not force fresh
          # GitHub downloads (a 2026-11-08 release-asset outage blocked deploys that way).
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{version}}-p{{cache_period}}-${{ hashFiles('mise.lock', '.mise/locks/**') }}"
      - name: Install security scanners
        run: mise install --locked -y aqua:astral-sh/uv betterleaks trivy
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Scan full checkout
        # Each scan is independent: a failed one (such as a Trivy database mirror
        # outage) must not skip the others.
        if: ${{ !cancelled() }}
        # Delegate to the task so the weekly scan reproduces locally and cannot drift.
        run: mise run check:scan:full
      - name: Audit locked dependencies
        if: ${{ !cancelled() }}
        # The full-checkout scan reads only uv.lock; this also audits the font script
        # lock and the Lighthouse/Playwright npm locks on quiet weeks without pushes.
        run: mise run check:vuln
  deployed-image:
    name: Scan images receiving production traffic
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: www-fmind-dev
      CLOUDSDK_RUN_REGION: europe-west1
    steps:
      - name: Checkout scanner policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4 # pinned mise; bump deliberately with mise.lock tooling
          install: false
          cache: false # this job holds id-token; never read shared caches
      - name: Install scanner and runtime
        run: mise install --locked -y python trivy
      - name: Authenticate read-only scanner
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: github-security@www-fmind-dev.iam.gserviceaccount.com
          workload_identity_provider: projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 592.0.0 # pinned Cloud SDK; the action defaults to latest
      - name: Authenticate image pulls
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Resolve and scan every serving digest
        run: mise run check:image:deployed
      - name: Retain digest and advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-image-advisories
          path: tmp/security/
          if-no-files-found: error
          retention-days: 30
