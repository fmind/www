# Docs: https://jactionlint.jdx.dev/config
profile: pedantic
rules:
  # Dependabot runs security updates only, which ignore cooldowns; version updates are managed deliberately.
  dependabot-cooldown: off
  dependabot-missing-actions-update: off
  # Pin updates are reviewed manually via check:actions:online rather than held on release cooldown.
  action-release-cooldown: off
