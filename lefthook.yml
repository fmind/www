# Docs: https://lefthook.dev/configuration/
glob_matcher: doublestar
output: [summary, failure, execution_out]

# Jobs run in list order: formatters fix and restage only the staged files, then checks validate the tree.
pre-commit:
  jobs:
    - name: format docs and config
      glob: "**/*.{cjs,json,md,mjs,toml,yaml,yml}"
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    - name: format Python
      glob: "**/*.py"
      run: mise run format:python {staged_files}
      stage_fixed: true
    - name: format OpenTofu
      # tofu fmt rejects other HCL files such as infra/.tflint.hcl.
      glob: "infra/**/*.{tf,tofu,tfvars,tftest.hcl,tofutest.hcl}"
      run: mise run format:tofu {staged_files}
      stage_fixed: true
    - name: check
      run: mise run check:local
pre-push:
  parallel: true
  jobs:
    # Trivy downloads its vulnerability and misconfiguration databases; CI runs both through `check`.
    - name: network checks
      run: mise run check:network
    - name: test
      run: mise run test
