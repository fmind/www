glob_matcher: doublestar
pre-commit:
  parallel: false
  commands:
    format:dprint:
      glob: "**/*.{cjs,json,md,toml,yaml,yml}"
      priority: 10
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    format:templ:
      glob: "**/*.templ"
      priority: 11
      run: mise run format:templ {staged_files}
      stage_fixed: true
    format:go:
      glob: "**/*.go"
      priority: 12
      run: mise run format:go {staged_files}
      stage_fixed: true
    check:leaks:
      priority: 20
      run: mise run check:leaks --staged
    check:
      priority: 30
      run: mise run check
pre-push:
  commands:
    test:
      run: mise run test
