glob_matcher: doublestar
pre-commit:
  parallel: false
  commands:
    format:dprint:
      glob: "**/*.{cjs,json,md,toml,yaml,yml}"
      priority: 10
      run: mise run format:dprint
      stage_fixed: true
    format:python:
      glob: "**/*.py"
      priority: 11
      run: mise run format:python
      stage_fixed: true
    check:
      priority: 20
      run: mise run check
pre-push:
  commands:
    test:
      run: mise run test
