# Docs: https://mise.jdx.dev/configuration.html
[env]
APP_NAME = "www"
IMAGE_ARCHIVE = "tmp/www-image.tar"
# Production is linux/amd64; arm64 hosts override this in an ignored mise.local.toml
# because Granian's native module hangs under QEMU user emulation.
IMAGE_PLATFORM = "linux/amd64"
PROJECT_ID = "www-fmind-dev"
REPOSITORY = "app"
SERVICE_NAME = "www-fmind-dev"
REGION = "europe-west1"
# Trivy 0.76.2 reads pip's vendored CycloneDX SBOM from the Python base layer although the
# runtime stage uninstalls pip, and warns about a third-party SBOM. The file is absent from
# the final image and lists no PURLs, so skipping it hides nothing that ships. Applies to
# every Trivy run through mise, including CI and scheduled scans.
TRIVY_SKIP_FILES = "**/pip/_vendor/bom.cdx.json"
# Keep CI and hook logs free of vulnerability database download bars.
TRIVY_NO_PROGRESS = "true"

[settings.task]
run_auto_install = false

[tools]
"aqua:astral-sh/uv" = "0.13.7"
"github:dobicinaitis/tailwind-cli-extra" = "2.10.35"
betterleaks = "1.10.0"
dprint = "0.64.3"
# Release changelog and semver bump (release skill); the config stays in the owner's dotfiles.
git-cliff = "2.14.2"
hadolint = "2.15.1"
jactionlint = { version = "2.5.0", workflow = "release.yaml" }
lefthook = "2.2.2"
lychee = "0.24.2"
node = "26.13.0"
# Held: 13.6.0 pulls chromium-bidi@157.0.8090-0 without the trusted-publisher
# evidence its earlier releases carried, so mise trust policy rejects it (rechecked 2026-11-07).
"npm:lighthouse" = "13.5.0"
"npm:playwright" = "1.65.0"
opentofu = "1.13.9"
# Keep the qualified Python 3.14 runtime; 3.15 is a separate compatibility migration.
python = "3.14.10"
# Used implicitly by jactionlint (check:actions) to lint workflow run: scripts;
# it skips them silently when absent.
shellcheck = "0.11.0"
tflint = "0.65.0"
trivy = "0.76.2"
typos = "1.52.0"

# MCP Registry publisher for the release skill. The release also ships registry server
# assets, so select the publisher archive per platform (signature side files excluded).
[tools."github:modelcontextprotocol/registry"]
version = "1.8.8"

[tools."github:modelcontextprotocol/registry".platforms]
linux-arm64 = { asset_pattern = "mcp-publisher_linux_arm64.tar.gz" }
linux-x64 = { asset_pattern = "mcp-publisher_linux_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "mcp-publisher_darwin_arm64.tar.gz" }

[tasks.all]
alias = "a"
description = "Format, check, test, build, and exercise browser contracts"
run = [
  "mise run format",
  "mise run check",
  "mise run build",
  "mise run --skip-deps test",
  "mise run check:image",
  "mise run test:image",
  "mise run install:browser",
  "mise run --skip-deps test:browser",
]

[tasks.build]
alias = "b"
description = "Build Python distribution artifacts and production CSS"
depends = ["build:css"]
run = "uv build --clear"

[tasks."build:branding"]
description = "Rebuild navigation, favicons, and social preview from the public PNG masters"
run = "uv run --locked python -m scripts.build_branding"

[tasks."build:css"]
description = "Compile and minify Tailwind CSS"
run = "tailwindcss-extra -i assets/css/input.css -o static/dist/styles.css --minify"

[tasks."build:fonts"]
description = "Rebuild the self-hosted WOFF2 subsets from pinned upstream releases"
# scripts/build_fonts.py.lock pins fonttools' brotli and zopfli extras; refresh it with `uv lock --script`.
run = "uv run --locked --script scripts/build_fonts.py"

[tasks."build:image"]
description = "Build the IMAGE_PLATFORM production OCI image as a local archive"
run = 'mkdir -p tmp && docker buildx build --platform "$IMAGE_PLATFORM" --target runner --tag "$APP_NAME:local" --output "type=docker,dest=$IMAGE_ARCHIVE" .'

[tasks."build:images"]
description = "Generate changed or missing article image derivatives"
run = "uv run --locked python -m scripts.build_images"

[tasks."build:portrait"]
description = "Export a public portrait without personal metadata from a private JPEG master"
raw_args = true
run = "uv run --locked python -m scripts.build_portrait"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = [
  "check:actions",
  "check:dockerfile",
  "check:format",
  "check:images",
  "check:leaks",
  "check:lighthouse",
  "check:links:local",
  "check:lint",
  "check:types",
  "check:typos",
]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
# Both run Trivy, which downloads its vulnerability or misconfiguration database.
depends = ["check:scan", "check:vuln"]

[tasks."check:actions"]
alias = "ca"
description = "Lint and audit GitHub Actions workflows, actions, and Dependabot (jactionlint)"
# Offline by default; .github/jactionlint.yaml selects the profile and ignores.
run = "jactionlint"

[tasks."check:dockerfile"]
alias = "cd"
description = "Lint Dockerfile (hadolint)"
run = "hadolint Dockerfile"

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv lock --check",
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked ruff format --check",
  "dprint check",
]

[tasks."check:image"]
description = "Build and scan the exact local production OCI image"
depends = ["build:image"]
# The owner has a global Trivy policy; unset it so local and CI scans use the
# complete policy below and fail on the same fixable runtime findings. Inspect
# without --ignore-unfixed when reviewing advisories that have no patch yet.
run = 'env -u TRIVY_CONFIG trivy image --input "$IMAGE_ARCHIVE" --platform "$IMAGE_PLATFORM" --exit-code=1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret'

[tasks."check:image:deployed"]
description = "Resolve and scan every serving or tagged Cloud Run revision with Trivy"
run = "python -m scripts.scan_deployed"

[tasks."check:image:digest"]
description = "Scan an immutable remote image digest with Trivy"
raw_args = true
# The owner has a global Trivy policy; unset it so local and CI scans use the
# complete policy below and fail on the same fixable runtime findings.
run = "env -u TRIVY_CONFIG trivy image --platform linux/amd64 --exit-code=1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret"

[tasks."check:images"]
description = "Validate article image derivatives without changing files"
run = "uv run --locked python -m scripts.build_images --check"

[tasks."check:leaks"]
alias = "cs"
description = "Audit recent commits and the working tree for leaked secrets (betterleaks)"
# The Lighthouse harness test briefly creates and removes a symlink fixture under tmp/;
# scanning concurrently logs a spurious lstat error, so let it finish first.
wait_for = ["check:lighthouse"]
run = [
  'betterleaks git --redact=100 --log-opts="--max-count=100" --verbose --no-banner',
  "betterleaks dir . --config assets/betterleaks-dir.toml --redact=100 --verbose --no-banner",
]

[tasks."check:leaks:full"]
description = "Audit the complete Git history for leaked secrets (weekly security workflow)"
run = "betterleaks git --redact=100 --verbose --no-banner"

[tasks."check:lighthouse"]
description = "Test the Lighthouse qualification harness without network access"
run = "node --test scripts/lighthouse.test.mjs"

[tasks."check:links"]
alias = "ck"
description = "Check publication, portfolio, and documentation links"
# --hidden adds .agents/skills; .gitignore still keeps .venv and caches out.
run = "lychee --hidden --root-dir \"$PWD\" . src/www/data.py"

[tasks."check:links:local"]
description = "Check local file links and Markdown anchors offline (lychee)"
# Fragments are checked only offline: many remote docs render anchors with JavaScript.
run = "lychee --offline --hidden --include-fragments --no-progress --root-dir \"$PWD\" . src/www/data.py"

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked ruff check"

[tasks."check:scan"]
description = "Scan Dockerfile and infrastructure for misconfigurations (trivy config)"
# Unset the owner's global policy, then state the complete repository policy so
# local and CI scans cannot diverge through inherited configuration.
# A syntactically valid placeholder lets Trivy evaluate the budget resource; plans use the real account.
env.TF_VAR_billing_account = "000000-AAAAAA-000000"
run = "env -u TRIVY_CONFIG trivy config --exit-code=1 --severity LOW,MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore --skip-dirs tmp --skip-dirs .venv --skip-dirs dist ."

[tasks."check:scan:full"]
description = "Scan the full checkout for vulnerabilities, secrets, and misconfigurations (weekly security workflow)"
# A syntactically valid placeholder lets Trivy evaluate the budget resource; plans use the real account.
env.TF_VAR_billing_account = "000000-AAAAAA-000000"
run = "env -u TRIVY_CONFIG trivy fs --exit-code=1 --severity HIGH,CRITICAL --scanners vuln,secret,misconfig --skip-dirs tmp --skip-dirs .venv --skip-dirs dist ."

[tasks."check:tofu"]
description = "Validate, lint, and test the OpenTofu configuration"
# Backend-free init needs network access for schemas. Isolate its data directory
# so a previous live backend cache cannot make validation read remote state.
env.TF_DATA_DIR = "../tmp/tofu-check"
run = [
  "tofu -chdir=infra fmt -check -recursive",
  "tofu -chdir=infra init -backend=false -input=false -lockfile=readonly",
  "tofu -chdir=infra validate",
  "tofu -chdir=infra test",
  "tflint --chdir=infra",
]

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked ty check"

[tasks."check:typos"]
description = "Check article prose for common spelling mistakes"
run = "typos content/articles"

[tasks."check:vuln"]
alias = "cv"
description = "Scan Python and mise npm tool dependencies for known vulnerabilities (uv + trivy)"
run = [
  "uv audit --preview-features audit-command --locked",
  "uv audit --preview-features audit-command --locked --script scripts/build_fonts.py",
  # Scan the maintained lock, not third-party checkouts under tmp/.
  "env -u TRIVY_CONFIG trivy fs --exit-code=1 --severity HIGH,CRITICAL --scanners vuln --ignorefile .trivyignore uv.lock",
  # mise locks npm tools (Lighthouse, Playwright) as pnpm-format aube-lock.yaml. Dependabot
  # never reads it, and Trivy skips it unless the file name is mapped to the pnpm parser.
  "env -u TRIVY_CONFIG trivy fs --exit-code=1 --severity HIGH,CRITICAL --scanners vuln --ignorefile .trivyignore --file-patterns 'pnpm:aube-lock\\.yaml' .mise/locks",
]

[tasks.clean]
alias = "n"
description = "Remove build artifacts, caches, and coverage files"
run = "rm -rf .cache/ .coverage .pytest_cache/ .ruff_cache/ .ty_cache/ dist/ htmlcov/ tmp/ static/dist/styles.css"

[tasks.coverage]
alias = "v"
description = "Show test coverage in the terminal"
depends = ["test"]
run = "uv run --locked coverage report"

[tasks.deploy]
description = "Deploy one immutable Artifact Registry digest and its commit SHA to Cloud Run"
raw_args = true
# On demand only, never from a hook or `all`: this mutates production. CI owns
# the routine path (push to main); this is for manual rollout and rollback, so
# it creates a named no-traffic candidate and verifies health/digest/commit before
# routing traffic to that exact revision. OpenTofu
# still owns the rest of the service shape. The typed boundary rejects tags,
# foreign repositories, missing digests, non-SHA commits, and extra flags
# before constructing fixed project/region/service gcloud argv.
run = "uv run --locked python -m scripts.deploy"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python", "format:tofu"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint, or only the given files"
# mise appends the hook's {staged_files}; the flag keeps an empty list from exiting 14.
run = "dprint fmt --allow-no-files"

# Lefthook passes staged files; mise hands variadic arguments over as one shell-quoted
# string, which `eval "set -- ..."` splits back safely. Without files, Ruff formats the project.
[tasks."format:python"]
description = "Sort imports and format Python sources, or only the given files (ruff)"
usage = 'arg "[files]..."'
run = '''
eval "set -- $usage_files"
uv run --locked ruff check --select=I --fix --force-exclude "$@"
uv run --locked ruff format --force-exclude "$@"
'''

# Without files, format infra/ (tofu fmt rejects other HCL such as infra/.tflint.hcl).
[tasks."format:tofu"]
description = "Format the OpenTofu configuration, or only the given files"
usage = 'arg "[files]..."'
run = '''
eval "set -- $usage_files"
if [ "$#" -eq 0 ]; then set -- infra; fi
tofu fmt -recursive "$@"
'''

[tasks.install]
alias = "i"
description = "Install locked development and browser dependencies"
depends = ["install:python", "install:browser"]

[tasks."install:browser"]
description = "Install the Chromium version used by browser and Lighthouse tests"
run = "playwright install chromium"

[tasks."install:browser:cross"]
description = "Install pinned Firefox and WebKit (requires their Linux system libraries)"
run = "playwright install firefox webkit"

[tasks."install:python"]
description = "Install locked Python dependencies and Git hooks"
run = ["uv sync --locked --all-groups", "lefthook install"]

[tasks.test]
alias = "t"
description = "Run offline tests with the branch-coverage gate"
depends = ["build:css"]
run = "uv run --locked pytest --cov --cov-fail-under=91"

[tasks."test:browser"]
description = "Exercise navigation, articles, and calculators in Chromium"
# The Playwright server runs the app from source; it needs the stylesheet, not a wheel.
depends = ["build:css"]
# Playwright is a pinned mise CLI, keeping browser tooling outside the application.
run = 'NODE_PATH="$(mise where npm:playwright)/node_modules" env -u NO_COLOR playwright test --config tests/playwright.config.cjs'

[tasks."test:browser:cross"]
description = "Smoke-test portfolio and contact journeys in Firefox and WebKit"
# The Playwright server runs the app from source; it needs the stylesheet, not a wheel.
depends = ["build:css"]
run = 'NODE_PATH="$(mise where npm:playwright)/node_modules" env -u NO_COLOR playwright test --config tests/playwright.cross.config.cjs'

[tasks."test:image"]
description = "Smoke-test the already-built production OCI archive or remote digest"
raw_args = true
run = "uv run --locked --no-dev --group ops python -m scripts.image_smoke"

[tasks."test:candidate"]
description = "Verify the no-traffic CANDIDATE_TAG revision is IMAGE_REF/GITHUB_SHA and serves health/discovery"
run = "uv run --locked --no-dev --group ops python -m scripts.verify_deployment candidate"

[tasks."test:deployed"]
description = "Verify IMAGE_REF and GITHUB_SHA own ready production traffic and public health"
run = "uv run --locked --no-dev --group ops python -m scripts.verify_deployment"

[tasks."test:lighthouse"]
description = "Run the manual Lighthouse qualification matrix with an already-installed Chromium"
run = "node scripts/lighthouse.mjs"

[tasks."test:lighthouse:local"]
description = "Start a temporary server and run the strict portfolio Lighthouse matrix"
# The Playwright server runs the app from source; it needs the stylesheet, not a wheel.
depends = ["build:css"]
run = 'NODE_PATH="$(mise where npm:playwright)/node_modules" env -u NO_COLOR playwright test --config tests/playwright.lighthouse.config.cjs'

[tasks."test:watch"]
alias = "tw"
description = "Run offline tests in watch mode"
depends = ["build:css"]
run = "uv run --locked pytest-watcher . --now"

[tasks.watch]
alias = "w"
description = "Run the dev server with live reload (Python + CSS)"
depends = ["watch:css", "watch:server"]

[tasks."watch:css"]
hide = true
depends = ["build:css"]
run = "tailwindcss-extra -i assets/css/input.css -o static/dist/styles.css --watch"

[tasks."watch:server"]
hide = true
depends = ["build:css"]
# Watch startup inputs only; browser artifacts and build output must not restart workers.
# Granian binds 127.0.0.1 by default, keeping development drafts off the local network;
# `GRANIAN_HOST=0.0.0.0 mise run watch` opts in to LAN access (for example from a phone).
run = 'GRANIAN_PORT="${PORT:-8080}" uv run --locked granian --interface asgi --reload --reload-paths src --reload-paths content --reload-paths static www.app:app'
