[env]
APP_NAME = "www"
PROJECT_ID = "www-fmind-dev"
SERVICE_NAME = "www-fmind-dev"
REGION = "europe-west1"

[settings.task]
run_auto_install = false

[tools]
"github:dobicinaitis/tailwind-cli-extra" = "2.10.10"
actionlint = "1.7.12"
dprint = "0.55.2"
gitleaks = "8.30.1"
go = "1.26.6"
golangci-lint = "2.12.2"
gotestsum = "1.13.0"
hadolint = "2.15.1"
lefthook = "2.1.10"
lychee = "0.24.2"
node = "24.20.0"
"npm:playwright" = "1.63.0"
opentofu = "1.12.5"
tflint = "0.64.0"
trivy = "0.73.0"
typos = "1.49.0"
zizmor = "1.29.0"

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build", "mise run test:browser"]

[tasks.build]
alias = "b"
description = "Compile the production binary"
depends = ["build:go"]

[tasks."build:css"]
description = "Compile and minify Tailwind CSS"
run = "tailwindcss-extra -i assets/css/input.css -o static/dist/styles.css --minify"

[tasks."build:go"]
description = "Compile the production Go binary"
depends = ["build:templ", "build:css"]
sources = ["go.mod", "go.sum", "**/*.go", "static/**"]
outputs = ["bin/{{env.APP_NAME}}"]
run = "go build -trimpath -o bin/$APP_NAME ./cmd/$APP_NAME"

[tasks."build:images"]
description = "Generate the downscaled article image derivatives (FORCE=1 rebuilds all)"
sources = ["static/img/articles/*/*", "cmd/images/**/*.go"]
outputs = ["static/img/articles/*/*-800.webp"]
run = "go run -tags nodynamic ./cmd/images"

[tasks."build:image"]
description = "Build the production OCI image"
run = "docker build --target runner -t $APP_NAME:local ."

[tasks."build:templ"]
description = "Generate Go code from Templ templates"
sources = ["**/*.templ"]
outputs = ["**/*_templ.go"]
# Templ emits ungrouped imports; pass concrete generated files to the same
# formatters as the hook so clean installs and staged-file checks are byte-stable.
run = [
  "go tool templ generate",
  "go tool goimports -local github.com/fmind/www -w templates/*_templ.go",
  "go tool gofumpt -w templates/*_templ.go",
]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:actions",
  "check:lint",
  "check:vuln",
  "check:format",
  "check:leaks",
  "check:dockerfile",
  "check:scan",
  "check:typos",
]

[tasks."check:actions"]
alias = "ca"
description = "Lint and audit GitHub Actions workflows (actionlint + zizmor)"
# Select offline mode explicitly: the workflow audit requires no credentials.
run = ["actionlint", "zizmor --offline .github/workflows/"]

[tasks."check:dockerfile"]
alias = "cd"
description = "Lint Dockerfile (hadolint)"
run = "hadolint Dockerfile"

[tasks."check:format"]
alias = "cf"
description = "Check config/markup formatting (dprint)"
run = "dprint check"

[tasks."check:leaks"]
alias = "cs"
description = "Audit git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact=100 --log-opts=\"--max-count=100\" --verbose"

[tasks."check:links"]
alias = "ck"
description = "Check external content links are reachable"
run = "lychee --root-dir \"$PWD\" ."

[tasks."check:typos"]
description = "Check article prose for common spelling mistakes"
run = "typos content/articles"

[tasks."check:lint"]
alias = "cl"
description = "Lint Go sources (golangci-lint)"
depends = ["build:templ"]
# golangci-lint caches absolute source paths. Keep the cache with this checkout
# so moving or renaming the repository cannot replay findings for an old path.
run = "GOLANGCI_LINT_CACHE=\"$PWD/tmp/golangci-lint\" golangci-lint run ./..."

[tasks."check:scan"]
description = "Scan Dockerfile and infrastructure for misconfigurations (trivy config)"
# Severity is pinned on the command line on purpose. Left unset, trivy falls
# back to the developer's ~/.config/trivy/trivy.yaml, which CI does not have —
# that divergence let a LOW finding pass locally and fail the pipeline. A CLI
# flag outranks every config file, so this reads the same everywhere.
# Reviewed exceptions live in .trivyignore, each with its reason.
run = "trivy config --exit-code=1 --severity LOW,MEDIUM,HIGH,CRITICAL ."

[tasks."check:tofu"]
description = "Validate and lint the OpenTofu configuration"
# `init` downloads provider schemas, so this is network-dependent and stays out
# of the offline `check` fan-out and the pre-commit hook. CI runs it on every
# infra change; run it by hand while working on infra.
#
# TF_DATA_DIR redirects the working directory to a scratch path (relative to
# `-chdir`, hence the `../`). Without it, `-backend=false` still reads the real
# `infra/.terraform/` cache left by a manual `tofu init`, sees the recorded GCS
# backend, and tries to load remote state — so the check failed with an auth
# error on any machine that had ever applied, while passing in CI where no
# cache exists. The scratch dir has no backend recorded, so validation stays
# credential-free everywhere.
env.TF_DATA_DIR = "../tmp/tofu-check"
run = [
  "tofu -chdir=infra fmt -check -recursive",
  "tofu -chdir=infra init -backend=false -input=false -lockfile=readonly",
  "tofu -chdir=infra validate",
  "tflint --chdir=infra",
]

[tasks."check:vuln"]
alias = "cv"
description = "Scan Go code for known vulnerabilities (govulncheck)"
run = [
  "go tool govulncheck ./...",
  # Include tool and transitive dependencies even when no vulnerable call is reachable.
  "trivy fs --exit-code=1 --severity HIGH,CRITICAL --scanners vuln .",
]

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = "rm -rf bin/ tmp/ coverage.out static/dist/styles.css"

[tasks.coverage]
alias = "v"
description = "Show test coverage in the terminal"
depends = ["test"]
run = "go tool cover -func=coverage.out"

[tasks.deploy]
description = "Deploy an image digest to Cloud Run — pass the image ref as the argument"
# On demand only, never from a hook or `all`: this mutates production. CI owns
# the routine path (push to main); this is for manual rollout and rollback, so
# it sets only the image — OpenTofu still owns the rest of the service shape.
# mise appends CLI args to the last command: `mise run deploy <image-ref>`.
# Update requires the service to exist; the explicit project prevents a shell's
# unrelated gcloud default from receiving a rollout or accidentally creating one.
run = "gcloud run services update $SERVICE_NAME --project=$PROJECT_ID --billing-project=$PROJECT_ID --region=$REGION --image"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:go", "format:templ", "format:dprint", "format:tofu"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt"

[tasks."format:go"]
description = "Format Go sources and imports (goimports + gofumpt)"
run = [
  "go tool goimports -local github.com/fmind/www -w .",
  "go tool gofumpt -w .",
]

[tasks."format:templ"]
description = "Format Templ templates"
run = "go tool templ fmt ."

[tasks."format:tofu"]
description = "Format the OpenTofu configuration"
run = "tofu -chdir=infra fmt -recursive"

[tasks.install]
alias = "i"
description = "Tidy Go modules and download dependencies"
depends = ["install:go", "install:browser"]

[tasks."install:go"]
description = "Tidy Go modules and download dependencies"
depends = ["build:templ"]
run = "go mod tidy"

[tasks.test]
alias = "t"
description = "Run the test suite (gotestsum)"
depends = ["build:templ", "build:css"]
run = "gotestsum --format pkgname -- -race -coverprofile=coverage.out ./..."

[tasks."test:watch"]
alias = "tw"
description = "Run the test suite in watch mode"
depends = ["build:templ", "build:css"]
run = "gotestsum --watch --format pkgname -- -race -coverprofile=coverage.out ./..."

[tasks.watch]
alias = "w"
description = "Run the dev server with live reload (Go + CSS)"
depends = ["watch:css", "watch:air"]

[tasks."watch:air"]
hide = true
run = "go tool air"

[tasks."watch:css"]
hide = true
run = "tailwindcss-extra -i assets/css/input.css -o static/dist/styles.css --watch"

[tasks."install:browser"]
description = "Install the Chromium version used by the browser regression suite"
run = "playwright install chromium"

[tasks."test:browser"]
description = "Exercise navigation, articles, and calculators in Chromium"
depends = ["build"]
# Playwright is a pinned mise CLI, keeping browser tooling outside the application.
run = 'NODE_PATH="$(mise where npm:playwright)/node_modules" env -u NO_COLOR playwright test --config tests/playwright.config.cjs'
