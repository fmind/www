{# Runs after the footer exists, so it can wire the footer's Cookie settings control. #}
<script nonce="{{ nonce }}">
  (function () {
    var id = {{ metadata.google_analytics_id | tojson }};
    var key = 'fmind-consent';
    var banner = document.getElementById('consent');
    // Local, test and preview origins never ask for consent or load Google Analytics.
    if (location.hostname !== 'www.fmind.dev' || !banner) return;
    var stored = function () {
      try { return localStorage.getItem(key); } catch (error) { return null; }
    };
    // gtag.js honours this documented opt-out flag; consent "denied" alone still sends cookieless pings.
    var disable = 'ga-disable-' + id;
    var opener = null;
    var load = function () {
      window[disable] = false;
      if (window.gtag) {
        window.gtag('consent', 'update', { analytics_storage: 'granted' });
        return;
      }
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('consent', 'default', { analytics_storage: 'granted', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      window.gtag('js', new Date());
      window.gtag('config', id, { allow_google_signals: false, allow_ad_personalization_signals: false });
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
      document.head.appendChild(script);
    };
    var forget = function () {
      // Stop a tag already loaded on this page from sending anything else.
      window[disable] = true;
      if (window.gtag) window.gtag('consent', 'update', { analytics_storage: 'denied' });
      // GA cookies sit on the registrable domain, shared with the course subdomains.
      document.cookie.split(';').forEach(function (cookie) {
        var name = cookie.split('=')[0].trim();
        if (name !== '_ga' && name.indexOf('_ga_') !== 0) return;
        ['', '; domain=.fmind.dev', '; domain=www.fmind.dev'].forEach(function (domain) {
          document.cookie = name + '=; Max-Age=0; path=/' + domain;
        });
      });
    };
    banner.querySelectorAll('[data-consent]').forEach(function (button) {
      button.addEventListener('click', function () {
        var choice = button.getAttribute('data-consent');
        try { localStorage.setItem(key, choice); } catch (error) {}
        if (choice === 'granted') load(); else forget();
        var focused = banner.contains(document.activeElement);
        banner.hidden = true;
        // Hiding the focused button would drop keyboard focus to <body>: return it to the
        // control that opened the banner, or to the footer control that reopens it.
        var target = opener || document.querySelector('[data-consent-open]');
        if (focused && target) target.focus({ preventScroll: !opener });
      });
    });
    document.querySelectorAll('[data-consent-open]').forEach(function (control) {
      control.hidden = false;
      control.addEventListener('click', function () {
        opener = control;
        banner.hidden = false;
        banner.querySelector('button').focus();
      });
    });
    var choice = stored();
    if (choice === 'granted') load();
    else if (choice !== 'denied') banner.hidden = false;
  })();
</script>
