{% from "macros/icons.html" import icon %}
{# The primary navigation is 4rem tall plus its 1px bottom border. #}
<div id="section-toolbar" class="hidden min-[1024px]:max-[1600px]:block sticky top-[calc(4rem+1px)] z-30 bg-base-100 border-b border-base-200">
  <div class="relative max-w-screen-2xl mx-auto px-3 sm:px-6">
    <details id="section-menu">
      <summary class="flex w-fit min-h-11 items-center gap-2 px-2 list-none [&::-webkit-details-marker]:hidden rounded-lg text-sm text-primary hover:bg-selection cursor-pointer" title="On this page">
        {{ icon("menu", "w-5 h-5") }}<span>On this page</span>
      </summary>
      <nav class="absolute left-3 right-3 sm:right-auto sm:w-80 top-full max-h-[calc(100dvh-7.5rem)] overflow-y-auto overscroll-contain rounded-xl bg-base-100 p-3 shadow-lg border border-base-300" aria-label="Portfolio sections">
        {% include "partials/section-links.html" %}
      </nav>
    </details>
  </div>
</div>
