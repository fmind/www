# Docs: https://packaging.python.org/en/latest/specifications/declaring-project-metadata/

[project]
name = "www"
version = "1.4.4"
description = "Server-rendered portfolio and technical publication website"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Médéric Hurier" }]
dependencies = [
  "granian>=2.8.2,<3",
  "jinja2>=3.1.6,<4",
  "litestar[brotli,opentelemetry]>=2.24.0,<3",
  "markdown-it-py>=4.2.0,<5",
  "markupsafe>=3.0.3,<4",
  "mcp>=2.1.1,<3",
  "mcp-types>=2.1.1,<3",
  "mdit-py-plugins>=0.6.1,<0.7",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "pillow>=12.3.0,<13",
  "pydantic>=2.13.5,<3",
  "pygments>=2.21.0,<3",
  "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
  "anyio>=4.15.1,<5",
  "granian[reload]>=2.8.2,<3",
  "httpx>=0.28.1,<0.29",
  "pytest-cov>=7.1.0,<8",
  "pytest-watcher>=0.6.3,<0.7",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
  "ty>=0.0.78,<0.1",
  "validate-pyproject>=0.26,<0.27",
]

[project.scripts]
www = "www.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A", # flake8-builtins: prevent shadowing Python built-in names
  "ARG", # flake8-unused-arguments: enforce clean callable signatures
  "ASYNC", # flake8-async: async/await pitfalls and best practices
  "B", # flake8-bugbear: common bugs and design defects
  "C4", # flake8-comprehensions: clean list/dict/set comprehensions
  "E", # pycodestyle errors: style guide errors
  "ERA", # eradicate: detect and remove commented-out code
  "F", # pyflakes: logical errors and unused imports/variables
  "FA", # flake8-future-annotations: future annotation imports
  "FURB", # refurb: modernizing language idioms and constructs
  "I", # isort: clean and sorted imports
  "ISC", # flake8-implicit-str-concat: implicit string concatenation
  "LOG", # flake8-logging: standard logging practices
  "N", # pep8-naming: consistent PEP 8 naming conventions
  "PERF", # perflint: performance anti-patterns
  "PGH", # pygrep-hooks: require specific suppression rules
  "PIE", # flake8-pie: miscellaneous code improvements
  "PT", # flake8-pytest-style: idiomatic pytest patterns
  "PTH", # flake8-use-pathlib: prefer modern pathlib over os.path
  "Q", # flake8-quotes: consistent quote usage
  "RET", # flake8-return: cleaner return statements
  "RSE", # flake8-raise: raise statement improvements
  "RUF", # ruff: Ruff-native checks
  "S", # flake8-bandit: automated security issue detection
  "SIM", # flake8-simplify: code simplification
  "SLF", # flake8-self: private member access checks
  "T10", # flake8-debugger: prevent debugger breakpoints in production
  "T20", # flake8-print: prevent stray print statements
  "TID", # flake8-tidy-imports: clean and tidy imports
  "UP", # pyupgrade: modern Python syntax upgrades
  "W", # pycodestyle warnings: style guide warnings
]
ignore = [
  "ASYNC240", # Local file checks are intentionally synchronous at startup.
  "E501", # Long template-adjacent literals are clearer without wrapping.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # pytest assertions are intentional.
  "T201", # diagnostic output is useful in test helpers.
]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
pythonpath = ["src"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
